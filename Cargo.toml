[package]
name = "codex-gui"
version = "0.1.0"
edition = "2024"
default-run = "codex-gui"

[[bin]]
name = "codex-code-mode-host"
path = "src/bin/codex_code_mode_host.rs"

[[bin]]
name = "tool-render-gallery"
path = "src/bin/tool_render_gallery.rs"

[dependencies]
gpui = { git = "https://github.com/Open-Agents-GUI/zed.git", rev = "54dea564e795ef4e05c6533e630583d62b9bffa8" }
gpui_platform = { git = "https://github.com/Open-Agents-GUI/zed.git", rev = "54dea564e795ef4e05c6533e630583d62b9bffa8", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }
gpui-component = { git = "https://github.com/Open-Agents-GUI/gpui-kit.git", rev = "2bb6ce244287f41c8a855aeb4a3fe4c185e26881" }
gpui-component-assets = { git = "https://github.com/Open-Agents-GUI/gpui-kit.git", rev = "2bb6ce244287f41c8a855aeb4a3fe4c185e26881" }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
codex-app-server-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
codex-app-server-client = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
codex-arg0 = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
codex-code-mode-host = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
codex-core = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
codex-protocol = { git = "https://github.com/openai/codex.git", tag = "rust-v0.147.0" }
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# codex-utils-pty and filedescriptor exchange raw Win32 handles. Enabling the
# winapi std feature makes winapi::ctypes::c_void alias std::ffi::c_void,
# including on aarch64-pc-windows-msvc.
winapi = { version = "0.3.9", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { git = "https://github.com/Open-Agents-GUI/zed.git", rev = "54dea564e795ef4e05c6533e630583d62b9bffa8", features = [
    "test-support",
] }

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."https://github.com/openai/codex.git"]
codex-code-mode-runtime = { path = "crates/codex-code-mode-runtime-quickjs" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

# mirror configuration for crates compiled for the build platform
# (without this cargo will compile ~400 crates twice)
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = true

[profile.dev.package]
# proc-macros start
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
util_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
# proc-macros end

taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
cosmic-text = { opt-level = 3 }
fontdb = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
skrifa = { opt-level = 3 }
swash = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
unicode-script = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-base = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui_linux = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_wgpu = { opt-level = 3 }
collections = { opt-level = 3 }
sum_tree = { opt-level = 3 }
